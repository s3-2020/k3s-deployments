apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: markhaven-db
  namespace: dev
spec:
  serviceName: markhaven-db
  replicas: 1
  selector:
    matchLabels: { app: markhaven-db }
  template:
    metadata:
      labels: { app: markhaven-db }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          args: ["--binlog-format=ROW"]
          ports: [{ containerPort: 3306 }]
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: markhaven-db, key: root-password }
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: markhaven-db, key: wp-password }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        storageClassName: truenas-iscsi
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: markhaven-db
  namespace: dev
spec:
  clusterIP: None
  selector: { app: markhaven-db }
  ports: [{ port: 3306 }]
