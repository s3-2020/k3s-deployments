apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: usv-admin
  namespace: dev
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
  hostnames:
    - usv.kung.dk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /wp-login.php
        - path:
            type: PathPrefix
            value: /wp-admin
        - path:
            type: PathPrefix
            value: /xmlrpc.php
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: usv-admin-auth
      backendRefs:
        - group: ""
          kind: Service
          name: usv
          port: 80
          weight: 1
