apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: markhaven
  namespace: dev
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
  hostnames:
    - markhaven.kung.dk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: markhaven
          port: 80
          weight: 1
