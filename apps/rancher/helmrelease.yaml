apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: cattle-system
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rancher
      version: "2.15.1"
      sourceRef:
        kind: HelmRepository
        name: rancher-latest
        namespace: cattle-system
      interval: 1h
  values:
    hostname: rancher.kung.dk
    networkExposure:
      type: ingress
    ingress:
      ingressClassName: traefik
      tls:
        source: secret
        secretName: rancher-public-tls
    tls: ingress
