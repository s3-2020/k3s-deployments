apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: flux-system
spec:
  interval: 30m
  releaseName: rancher
  targetNamespace: cattle-system

  chart:
    spec:
      chart: rancher
      version: "2.15.1"
      sourceRef:
        kind: HelmRepository
        name: rancher-stable
        namespace: flux-system

  install:
    createNamespace: true

  values:
    hostname: rancher.kung.dk

    replicas: 3

    networkExposure:
      type: none

    tls: external

    bootstrapPassword: ""
