apiVersion: v1
kind: ConfigMap
metadata:
  name: status-json
  namespace: status
data:
  alerts.json: '{"ok": false, "monitoring": false, "firing": [], "updated": null}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: status-publisher
  namespace: status
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: status-publisher
  namespace: status
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["status-json"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: status-publisher
  namespace: status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: status-publisher
subjects:
  - kind: ServiceAccount
    name: status-publisher
    namespace: status
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: status-publisher-events
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: status-publisher-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: status-publisher-events
subjects:
  - kind: ServiceAccount
    name: status-publisher
    namespace: status
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-publisher
  namespace: status
data:
  publish.py: |
    import json, ssl, urllib.request, urllib.parse, datetime
    PROM = "http://prometheus-operated.monitoring.svc:9090/api/v1/query"
    API = "https://kubernetes.default.svc"
    TOKEN = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
    CTX = ssl.create_default_context(
        cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

    CILIUM = ('min(kube_daemonset_status_number_ready{daemonset="cilium"}) '
              '== bool min(kube_daemonset_status_desired_number_scheduled{daemonset="cilium"})')

    COMPONENTS = [
        ("API-server", 'up{job="apiserver"}', 'avg_over_time(up{job="apiserver"}[24h:1m])'),
        ("kubelet", 'up{job="kubelet"}', 'avg_over_time(up{job="kubelet"}[24h:1m])'),
        ("Cluster-DNS", 'up{job="coredns"}', 'avg_over_time(up{job="coredns"}[24h:1m])'),
        ("Cilium net", CILIUM, 'avg_over_time((%s)[24h:1m])' % CILIUM),
        ("DNS-filter", 'up{job="blocky"}', 'avg_over_time(up{job="blocky"}[24h:1m])'),
        ("Monitoring", 'up{job=~"prometheus-operated|.*kube-prometheus.*prometheus.*"}',
         'avg_over_time(up{job=~"prometheus-operated|.*kube-prometheus.*prometheus.*"}[24h:1m])'),
    ]

    def q(expr):
        try:
            url = PROM + "?query=" + urllib.parse.quote(expr)
            with urllib.request.urlopen(url, timeout=10) as r:
                return json.load(r)["data"]["result"]
        except Exception:
            return None

    monitoring, comps = True, []
    for name, live, upexpr in COMPONENTS:
        r = q(live)
        if r is None:
            monitoring = False
            comps.append({"name": name, "status": "unknown", "uptime24h": None})
            continue
        vals = [x["value"][1] == "1" for x in r]
        status = "up" if vals and all(vals) else ("down" if vals else "unknown")
        u = q(upexpr)
        up24 = None
        if u:
            try:
                up24 = round(float(u[0]["value"][1]) * 100, 2)
            except Exception:
                pass
        comps.append({"name": name, "status": status, "uptime24h": up24})

    def alerts(state):
        return sorted(
            [{"name": x["metric"].get("alertname", "?"),
              "severity": x["metric"].get("severity", "info")}
             for x in (q('ALERTS{alertstate="%s"}' % state) or [])
             if x["metric"].get("severity", "info") != "none"],
            key=lambda a: a["severity"])

    recent = sorted({x["metric"].get("alertname", "?")
                     for x in (q('changes(ALERTS{alertstate="firing"}[24h]) > 0') or [])
                     if x["metric"].get("severity", "info") != "none"})

    def events():
        try:
            req = urllib.request.Request(API + "/api/v1/events?limit=500",
                                         headers={"Authorization": "Bearer " + TOKEN})
            with urllib.request.urlopen(req, context=CTX, timeout=10) as r:
                items = json.load(r)["items"]
        except Exception:
            return []
        def ts(e):
            return (e.get("lastTimestamp") or e.get("eventTime")
                    or e["metadata"].get("creationTimestamp") or "")
        items.sort(key=ts, reverse=True)
        return [{"time": ts(e),
                 "type": e.get("type", "Normal"),
                 "reason": e.get("reason", ""),
                 "object": "%s/%s" % (e["involvedObject"].get("kind", "?"),
                                      e["involvedObject"].get("name", "?")),
                 "message": (e.get("message") or "")[:160]}
                for e in items[:10]]

    firing = alerts("firing")
    out = {"ok": monitoring and not firing,
           "monitoring": monitoring,
           "components": comps,
           "firing": firing,
           "pending": alerts("pending"),
           "recent": recent,
           "events": events(),
           "updated": datetime.datetime.now(datetime.timezone.utc).isoformat()}
    req = urllib.request.Request(
        "https://kubernetes.default.svc/api/v1/namespaces/status/configmaps/status-json",
        data=json.dumps({"data": {"alerts.json": json.dumps(out)}}).encode(),
        method="PATCH",
        headers={"Authorization": "Bearer " + TOKEN,
                 "Content-Type": "application/strategic-merge-patch+json"})
    urllib.request.urlopen(req, context=CTX, timeout=10)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: status-publisher
  namespace: status
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: status-publisher
          containers:
            - name: publish
              image: python:3-alpine
              command: ["python", "/cfg/publish.py"]
              volumeMounts:
                - { name: cfg, mountPath: /cfg }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
          volumes:
            - name: cfg
              configMap: { name: status-publisher }
