apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status
  namespace: status
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
  hostnames:
    - kung.dk
    - www.kung.dk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /status
      backendRefs:
        - group: ""
          kind: Service
          name: status
          port: 80
          weight: 1
