apiVersion: v1
kind: Namespace
metadata:
  name: backup
---
# Copy target for etcd snapshots. Retain on TrueNAS iSCSI — zfs-snapshot
# task on tank/Kubernetes covers this volume like every other PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-backups
  namespace: backup
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot-backup
  namespace: backup
spec:
  schedule: "5 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k3
          containers:
            - name: copy
              image: python:3-alpine
              # k3s writes etcd snapshots every 12h to the local disk of each
              # server; this node (k3) is the designated source. Snapshots are
              # root-only files, hence runAsUser 0 + read-only hostPath.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  SRC=/snapshots DST=/backup
                  mkdir -p "$DST"
                  new=0
                  for f in "$SRC"/*.db; do
                    [ -f "$f" ] || continue
                    out="$DST/$(basename "$f").gz"
                    if [ ! -f "$out" ]; then
                      gzip -c "$f" > "$out.tmp" && mv "$out.tmp" "$out"
                      new=$((new+1))
                    fi
                  done
                  find "$DST" -name '*.gz' -mtime +14 -delete
                  echo "copied $new new snapshot(s); $(ls -1 "$DST" | wc -l) file(s) retained"
              securityContext:
                runAsUser: 0
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: snapshots
              hostPath:
                path: /var/lib/rancher/k3s/server/db/snapshots
                type: Directory
            - name: backup
              persistentVolumeClaim:
                claimName: etcd-backups
