apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wp-SITENAME
  namespace: wp-SITENAME
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system
  hostnames:
    - SITENAME.kung.dk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: wordpress
          port: 80
          weight: 1
