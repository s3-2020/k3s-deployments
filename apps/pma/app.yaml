apiVersion: v1
kind: ConfigMap
metadata:
  name: phpmyadmin-php
  namespace: pma
data:
  security.ini: |
    ; Mitigering for CVE-2026-109618 / CVE-2026-109619 (PHP2Shell)
    ; phpmyadmin:5.2 images er stadig bygget pa PHP 8.3.35 (pre-fix).
    ; Fjern igen nar image er rebuildet med PHP >= 8.3.36 (tjek: kubectl exec ... -- php -r "echo PHP_VERSION;")
    session.upload_progress.enabled = 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: pma
spec:
  replicas: 1
  selector:
    matchLabels: { app: phpmyadmin }
  template:
    metadata:
      labels: { app: phpmyadmin }
    spec:
      containers:
        - name: phpmyadmin
          image: phpmyadmin:5.2
          ports: [{ containerPort: 80 }]
          env:
            - name: PMA_ARBITRARY
              value: "1"
            - name: UPLOAD_LIMIT
              value: 64M
            - name: PMA_BLOWFISH_SECRET
              valueFrom:
                secretKeyRef: { name: phpmyadmin, key: blowfish-secret }
          volumeMounts:
            - { name: php-security, mountPath: /usr/local/etc/php/conf.d/zz-security.ini, subPath: security.ini }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
      volumes:
        - name: php-security
          configMap: { name: phpmyadmin-php }
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: pma
spec:
  selector: { app: phpmyadmin }
  ports: [{ port: 80, targetPort: 80 }]
