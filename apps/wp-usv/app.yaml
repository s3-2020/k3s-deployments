apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-content
  namespace: wp-usv
spec:
  storageClassName: truenas-iscsi
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-php-uploads
  namespace: wp-usv
data:
  uploads.ini: |
    upload_max_filesize = 64M
    post_max_size = 64M
    memory_limit = 512M
    max_execution_time = 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wp-usv
spec:
  replicas: 1
  selector:
    matchLabels: { app: wordpress }
  strategy:
    type: Recreate          # shared RWO volume — never two pods at once
  template:
    metadata:
      labels: { app: wordpress }
    spec:
      containers:
        - name: wordpress
          image: wordpress:7.1.0-php8.3-apache
          ports: [{ containerPort: 80 }]
          env:
            - name: WORDPRESS_DB_HOST
              value: wordpress-db
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wp-usv-db, key: wp-password }
            - name: WORDPRESS_CONFIG_EXTRA
              valueFrom:
                secretKeyRef: { name: wp-usv-db, key: wp-config-extra }
          volumeMounts:
            - { name: content, mountPath: /var/www/html/wp-content }
            - { name: php-uploads, mountPath: /usr/local/etc/php/conf.d/99-uploads.ini, subPath: uploads.ini }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
      volumes:
        - name: content
          persistentVolumeClaim: { claimName: wordpress-content }
        - name: php-uploads
          configMap: { name: wordpress-php-uploads }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wp-usv
spec:
  selector: { app: wordpress }
  ports: [{ port: 80, targetPort: 80 }]
