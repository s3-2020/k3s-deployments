apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blocky
  namespace: blocky
  labels:
    app: blocky
spec:
  selector:
    matchLabels:
      app: blocky
  endpoints:
    - port: api
      path: /metrics
      # 60s: power plan 2026-10 — aligns with prometheusSpec.scrapeInterval
      interval: 60s
