apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flux-operator
  targetNamespace: flux-system

  chartRef:
    kind: OCIRepository
    name: flux-operator

  values:
    web:
      enabled: true
      config:
        baseURL: https://flux.kung.dk
