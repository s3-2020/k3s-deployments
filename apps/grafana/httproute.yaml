apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - grafana.kung.dk

  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: kube-system

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # lan-only (ipAllowList) er taget ud 2026-09-15: den gav 403 for alle,
      # også for en vært på 10.22.10.120 som ligger midt i den tilladte 10.22.0.0/16.
      # Traefik-tjenesten kører med externalTrafficPolicy: Cluster, så Cilium
      # omskriver kilde-adressen før Traefik ser den — listeren vurderer altså ikke
      # klienten. Sættes ind igen når klient-IP bevares (se k3s-gitops docs/05).

      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
