apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  prometheus-alerts-dashboard.json: |
    {
     "uid": "prometheus-alerts",
     "title": "Prometheus Alerts",
     "tags": [
      "prometheus",
      "alerts"
     ],
     "timezone": "Europe/Copenhagen",
     "editable": true,
     "panels": [
      {
       "type": "stat",
       "title": "Firing now",
       "id": 1,
       "gridPos": {
        "h": 5,
        "w": 6,
        "x": 0,
        "y": 0
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "count(ALERTS{alertstate=\"firing\"}) OR on() vector(0)",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
       "title": "Pending",
       "id": 2,
       "gridPos": {
        "h": 5,
        "w": 6,
        "x": 6,
        "y": 0
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "count(ALERTS{alertstate=\"pending\"}) OR on() vector(0)",
         "instant": true
        }
       ]
      },
      {
       "type": "table",
       "title": "Firing alerts",
       "id": 3,
       "gridPos": {
        "h": 10,
        "w": 12,
        "x": 0,
        "y": 5
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "ALERTS{alertstate=\"firing\"}",
         "instant": true,
         "format": "table"
        }
       ],
       "transformations": [
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "__name__": true,
           "job": true,
           "namespace": true,
           "pod": true,
           "instance": true
          },
          "renameByName": {
           "alertname": "Alert",
           "severity": "Severity"
          }
         }
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Alert count over time",
       "id": 4,
       "gridPos": {
        "h": 10,
        "w": 12,
        "x": 0,
        "y": 15
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "count(ALERTS{alertstate=\"firing\"}) OR on() vector(0)",
         "legendFormat": "firing"
        }
       ]
      },
      {
       "type": "text",
       "title": "Links",
       "id": 5,
       "gridPos": {
        "h": 4,
        "w": 12,
        "x": 0,
        "y": 25
       },
       "options": {
        "mode": "markdown",
        "content": "Rå visning: <http://prometheus.kung.dk/alerts>\n\nDette dashboard spejler Prometheus' `ALERTS`-serie (regler fra kube-prometheus-stack). Grafana-menuens *Alerting* viser kun Grafanas egne regler."
       }
      }
     ]
    }
