apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-nodes-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  truenas-nodes-dashboard.json: |
    {
     "uid": "homelab-nodes-storage",
     "title": "Noder & Storage - TrueNAS + k1-k3",
     "tags": [
      "homelab",
      "truenas",
      "nodes"
     ],
     "timezone": "Europe/Copenhagen",
     "schemaVersion": 39,
     "version": 3,
     "editable": true,
     "refresh": "1m",
     "time": {
      "from": "6h",
      "to": "now"
     },
     "templating": {
      "list": []
     },
     "annotations": {
      "list": [
       {
        "builtIn": 1,
        "datasource": {
         "type": "grafana",
         "uid": "-- Grafana --"
        },
        "enable": true,
        "hide": true,
        "iconColor": "rgba(0, 211, 255, 1)",
        "name": "Annotations & Alerts",
        "type": "dashboard"
       }
      ]
     },
     "panels": [
      {
       "id": 101,
       "type": "text",
       "title": "Om dashboardet",
       "gridPos": {
        "h": 4,
        "w": 24,
        "x": 0,
        "y": 0
       },
       "options": {
        "mode": "markdown",
        "content": "**noder (k1-k3)** måles af node-exporter og virker med det samme.\n\n**TrueNAS-rækken** kræver en exporter på TrueNAS og står tom indtil den er der. Der er ingen OpenMetrics-app i community-kataloget (det er en Enterprise-funktion), så den skal køres som Custom App - se `infrastructure/truenas-exporter/README.md` i k3s-gitops. Målingerne hentes fra `10.22.10.50:9100`, og ZFS-datasets vises pr. mountpoint."
       }
      },
      {
       "id": 102,
       "type": "row",
       "title": "Kubernetes-noder: kapacitet",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 5
       },
       "panels": []
      },
      {
       "id": 103,
       "type": "stat",
       "title": "CPU brugt %",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 4,
        "w": 3,
        "x": 0,
        "y": 6
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "decimals": 1,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 80
           },
           {
            "color": "red",
            "value": 90
           }
          ]
         },
         "min": 0,
         "max": 100
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "value",
        "graphMode": "area",
        "textMode": "auto"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\",instance!~\"10\\.22\\.10\\..*\"}[$__rate_interval])) * 100)) * on(instance) group_left(nodename) node_uname_info"
        }
       ]
      },
      {
       "id": 104,
