apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-content
  namespace: wordpress
spec:
  storageClassName: truenas-iscsi
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1
  selector:
    matchLabels: { app: wordpress }
  strategy:
    type: Recreate          # shared RWO volume — never two pods at once
  template:
    metadata:
      labels: { app: wordpress }
    spec:
      containers:
        - name: wordpress
          image: wordpress:6-php8.3-apache
          ports: [{ containerPort: 80 }]
          env:
            - name: WORDPRESS_DB_HOST
              value: wordpress-db
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress-db, key: wp-password }
          volumeMounts:
            - { name: content, mountPath: /var/www/html/wp-content }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
      volumes:
        - name: content
          persistentVolumeClaim: { claimName: wordpress-content }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  selector: { app: wordpress }
  ports: [{ port: 80, targetPort: 80 }]
